<!DOCTYPE html>
<html lang="pt-BR">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#1C2620; --ink-soft:#5B6B5E;
  --line:#DDE4D8; --forest:#2F5233; --forest-d:#213A24; --ochre:#B8722E;
  --brick:#A8432B; --sage:#7C9473; --radius:10px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161B17;--surface:#1E2620;--ink:#EDF2EA;--ink-soft:#9FB09B;--line:#2C362E;--forest:#6FA377;--forest-d:#3E5F45;--ochre:#D99456;--brick:#D97862;--sage:#7C9473;}
}
:root[data-theme="dark"]{--bg:#161B17;--surface:#1E2620;--ink:#EDF2EA;--ink-soft:#9FB09B;--line:#2C362E;--forest:#6FA377;--forest-d:#3E5F45;--ochre:#D99456;--brick:#D97862;--sage:#7C9473;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100%;}
h1,h2,h3,.brand{font-family:'Zilla Slab',serif;}
button,input,select,textarea{font-family:inherit;color:inherit;}
.app{display:flex;min-height:100vh;}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);}
.brand{font-size:1.3rem;font-weight:700;color:var(--forest-d);letter-spacing:.2px;}
.brand small{display:block;font-family:'Inter';font-weight:500;font-size:.68rem;color:var(--ink-soft);letter-spacing:.3px;}
nav.side{display:flex;flex-direction:column;width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:18px 10px;gap:2px;}
nav.side .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.92rem;color:var(--ink-soft);border:none;background:none;text-align:left;width:100%;}
nav.side .navitem svg{width:18px;height:18px;flex-shrink:0;}
nav.side .navitem.active{background:var(--forest);color:#fff;}
main{flex:1;min-width:0;padding:24px;max-width:920px;}
.section-title{font-size:1.5rem;margin:0 0 4px;color:var(--forest-d);}
.section-sub{color:var(--ink-soft);margin:0 0 20px;font-size:.92rem;}
.visit-banner{background:linear-gradient(135deg,var(--forest) 0%,var(--forest-d) 100%);color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:22px;}
.visit-banner .eyebrow{opacity:.85;font-size:.8rem;margin:0 0 6px;}
.visit-banner h2{margin:0 0 12px;font-size:1.25rem;color:#fff;}
.visit-list{list-style:none;padding:0;margin:0;display:grid;gap:6px;}
.visit-list li{display:flex;gap:8px;align-items:baseline;font-size:.92rem;}
.visit-list li::before{content:"→";opacity:.7;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media (max-width:680px){.grid{grid-template-columns:1fr;}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.card h3{margin:0 0 12px;font-size:1rem;color:var(--forest-d);}
.task-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
.task-row:last-child{border-bottom:none;}
.task-row.done .task-title{text-decoration:line-through;color:var(--ink-soft);}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--sage);background:none;flex-shrink:0;cursor:pointer;position:relative;}
.check.checked{background:var(--forest);border-color:var(--forest);}
.check.checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem;}
.task-title{flex:1;}
.tag{font-size:.68rem;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--ink-soft);border:1px solid var(--line);}
.tag.overdue{background:var(--brick);color:#fff;border-color:var(--brick);}
.empty{color:var(--ink-soft);font-size:.88rem;padding:8px 0;}
.btn{background:var(--forest);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:.88rem;font-weight:600;cursor:pointer;}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);}
.btn.del{background:none;border:none;color:var(--brick);font-size:1rem;cursor:pointer;padding:2px 6px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
.field label{font-size:.8rem;color:var(--ink-soft);}
.field input,.field select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.9rem;}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:20;}
@media (min-width:680px){.modal-back{align-items:center;}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
@media (min-width:680px){.modal{border-radius:14px;}}
.modal h3{margin-top:0;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--forest);color:#fff;border:none;width:52px;height:52px;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);}
@media (min-width:680px){.fab{bottom:24px;}}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px;}
@media (max-width:600px){.areas{grid-template-columns:1fr;}}
.area-card{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;}
.area-card h4{margin:0 0 4px;color:var(--forest-d);padding-right:44px;}
.area-card p{margin:0;font-size:.85rem;color:var(--ink-soft);}
.row-actions{position:absolute;top:10px;right:10px;display:flex;gap:2px;}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;cursor:pointer;color:var(--ink-soft);}
.tab.active{background:var(--forest);color:#fff;border-color:var(--forest);}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.card-head h3{margin:0;}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
.list-row:last-child{border-bottom:none;}
.list-row .meta{flex:1;min-width:0;}
.list-row .t1{font-weight:600;}
.list-row.done .t1{text-decoration:line-through;color:var(--ink-soft);}
.list-row .t2{color:var(--ink-soft);font-size:.8rem;}
.iconbtn{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:.95rem;padding:4px 6px;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;flex-shrink:0;}
.stat-line{display:flex;align-items:center;gap:8px;font-size:.85rem;padding:4px 0;}
.mini-bar-track{flex:1;height:8px;border-radius:6px;background:var(--bg);overflow:hidden;}
.mini-bar{height:100%;border-radius:6px;background:var(--forest);}
.indic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media (max-width:600px){.indic-grid{grid-template-columns:repeat(2,1fr);}}
.indic-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;}
.indic-card .l{font-size:.7rem;color:var(--ink-soft);margin-bottom:4px;}
.indic-card .v{font-size:1.05rem;font-weight:700;color:var(--forest-d);}
.hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.day-card{min-width:64px;flex-shrink:0;text-align:center;font-size:.82rem;}
.hour-card{min-width:52px;flex-shrink:0;text-align:center;font-size:.78rem;}
@media (max-width:760px){
  nav.side{position:fixed;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;width:100%;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-right:none;border-top:1px solid var(--line);z-index:8;overflow-x:auto;}
  nav.side .navitem{flex-direction:column;gap:3px;font-size:.62rem;padding:6px 8px;white-space:nowrap;}
  nav.side .navitem span{display:block;}
  main{padding:16px;padding-bottom:100px;}
}
</style>
</head>

const KEY='agrokods_v1';
function seed(){

function todayISO(){return new Date().toISOString().slice(0,10);}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
// Garante que um objeto de dados (recém-carregado ou importado de um backup) tenha todos os
// campos que a versão atual do AgroKods espera, preenchendo apenas o que estiver faltando —
// nunca sobrescreve dados já existentes. Isso permite abrir backups de versões mais antigas.
function migrateDB(db){
  if(!db.properties) db.properties=[];
  if(!db.talhoes) db.talhoes=[];
  if(!db.ciclos) db.ciclos=[];
  if(db.weatherCache===undefined) db.weatherCache=null;
  ['areas','tasks','culturas','projetos','sistemas','visitas','producao','estoque','compras'].forEach(k=>{ if(!db[k]) db[k]=[]; });
  if(!db.financeiro) db.financeiro={receitas:[],despesas:[]};
  else{ if(!db.financeiro.receitas) db.financeiro.receitas=[]; if(!db.financeiro.despesas) db.financeiro.despesas=[]; }
  db.properties.forEach(p=>{
    if(p.latitude===undefined) p.latitude=null;
    if(p.longitude===undefined) p.longitude=null;
    if(p.cidade===undefined) p.cidade='';
    if(p.estado===undefined) p.estado='';
    if(p.pais===undefined) p.pais='';
    if(p.timezone===undefined) p.timezone='America/Sao_Paulo';
  });
  return db;
}
let DB;
try{ const raw=localStorage.getItem(KEY); DB = raw? JSON.parse(raw) : seed(); if(!raw) save(); }
catch(e){ DB = seed(); }
migrateDB(DB);
save();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function areaName(id){ const a=DB.areas.find(x=>x.id===id); return a? a.name : '—'; }
function culturaName(id){ const c=DB.culturas.find(x=>x.id===id); return c? c.nome : '—'; }
function talhaoName(id){ const t=DB.talhoes.find(x=>x.id===id); return t? t.nome : '—'; }
function prodInfo(p){
  if(p.cicloId){ const c=DB.ciclos.find(x=>x.id===p.cicloId); if(c) return {cultura:culturaName(c.cultura),talhao:talhaoName(c.talhao)}; }
  return {cultura:culturaName(p.cultura),talhao:'—'};
}
function brl(v){ return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }
const TALHAO_STATUS=['Disponível','Preparação','Plantado','Em desenvolvimento','Em produção','Em descanso','Encerrado'];
const TALHAO_DOT={'Disponível':'#9aa79a','Preparação':'#B8722E','Plantado':'#5B8FB9','Em desenvolvimento':'#D9A441','Em produção':'#2F5233','Em descanso':'#8A8F87','Encerrado':'#6b6b6b'};
const CICLO_STATUS=['Planejado','Plantado','Desenvolvimento','Floração','Frutificação','Em colheita','Encerrado'];

function activeCiclo(talhaoId){ const cs=DB.ciclos.filter(c=>c.talhao===talhaoId && c.status!=='Encerrado'); return cs[cs.length-1]||null; }
function fmtTemp(v){ return v==null? '—' : Math.round(v)+'°'; }
function fmtMm(v){ return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}).format(v||0)+' mm'; }
function fmtPct(v){ return Math.round(v||0)+'%'; }
function fmtWind(v){ return Math.round(v||0)+' km/h'; }
function hhmm(iso){ return iso? iso.slice(11,16) : '—'; }
function dayLabel(dateStr,idx){
  if(idx===0) return 'Hoje';

// Camada de acesso à Open-Meteo (https://open-meteo.com/) — isolada para permitir trocar/intermediar
// o provedor climático futuramente sem alterar as telas do AgroKods.
const WeatherService = {
  BASE:'https://api.open-meteo.com/v1/forecast',
  buildUrl(lat,lon,timezone){
    const params=new URLSearchParams({
      latitude:lat, longitude:lon,
      current:'temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m',
      hourly:'temperature_2m,precipitation,precipitation_probability,relative_humidity_2m,wind_speed_10m,weather_code',
      daily:'temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,sunrise,sunset,et0_fao_evapotranspiration,weather_code',
      timezone: timezone||'America/Sao_Paulo',
      forecast_days:7
    });
    return `${this.BASE}?${params.toString()}`;
  },
  // Busca os dados atuais/horários/diários da Open-Meteo. Lança erro em falha de rede,
  // HTTP não-ok ou resposta sem os blocos esperados — quem chama decide o que fazer (ver refreshClima).
  async getWeatherData(lat,lon,timezone){
    const res=await fetch(this.buildUrl(lat,lon,timezone));
    if(!res.ok) throw new Error('http-'+res.status);
    const json=await res.json();
    if(!json||!json.current||!json.daily||!json.hourly) throw new Error('resposta-invalida');
    return json;
  },
  // Converte o weather_code (WMO) da Open-Meteo em texto/ícone em português.
  weatherCodeToText(code){
    const map={0:'Céu limpo',1:'Principalmente limpo',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',
      51:'Chuvisco fraco',53:'Chuvisco',55:'Chuvisco forte',61:'Chuva fraca',63:'Chuva',65:'Chuva forte',
      71:'Neve fraca',73:'Neve',75:'Neve forte',80:'Pancadas de chuva',81:'Pancadas de chuva',82:'Pancadas de chuva fortes',
      95:'Trovoada',96:'Trovoada com granizo',99:'Trovoada com granizo'};
    return map[code] || 'Condição indisponível';
  },
  weatherCodeToIcon(code){
    if(code===0) return '☀️';
    if(code===1||code===2) return '🌤️';
    if(code===3) return '☁️';
    if(code===45||code===48) return '🌫️';
    if([51,53,55].includes(code)) return '🌦️';
    if([61,63,65,80,81,82].includes(code)) return '🌧️';
    if([71,73,75].includes(code)) return '❄️';
    if([95,96,99].includes(code)) return '⛈️';
    return '🌡️';
  }
};

// Só consulta a API se não houver cache, se o cache tiver mais de 30min, ou se a localização mudou.
function maybeRefreshClima(){
  const prop=DB.properties[0];
  if(!prop||prop.latitude==null||prop.longitude==null) return;
  const cache=DB.weatherCache;
  const stale=!cache || (Date.now()-cache.timestamp>1800000) || cache.latitude!==prop.latitude || cache.longitude!==prop.longitude;
  if(stale) refreshClima();
}
function refreshClima(){
  if(climaLoading) return;
  const prop=DB.properties[0];
  if(!prop||prop.latitude==null||prop.longitude==null) return;
  climaLoading=true; climaError=null;
  if(view==='clima') renderContent();
  WeatherService.getWeatherData(prop.latitude,prop.longitude,prop.timezone).then(data=>{
    DB.weatherCache={data,timestamp:Date.now(),latitude:prop.latitude,longitude:prop.longitude};
    save(); climaLoading=false; climaError=null;
    if(view==='clima'||view==='dashboard') renderContent();
  }).catch(()=>{
    climaLoading=false;
    climaError='Não foi possível atualizar o clima. Verifique sua conexão com a internet e tente novamente.';
    if(view==='clima') renderContent();
  });
}

function climaAlertas(days){
  const next3=days.slice(0,3);
  const totalRain=next3.reduce((s,x)=>s+(x.rain||0),0);
  const maxTemp=Math.max(...next3.map(x=>x.max||0));
  const alerts=[];
  if(totalRain>10) alerts.push({icon:'🌧️',title:'Chuva prevista',text:'Há previsão de chuva significativa nos próximos dias.'});
  else if(totalRain<1) alerts.push({icon:'☀️',title:'Período seco',text:'Não há precipitação relevante prevista nos próximos dias.'});
  if(maxTemp>=35) alerts.push({icon:'🌡️',title:'Atenção à temperatura',text:'Temperaturas elevadas previstas para os próximos dias.'});
  if(!alerts.length) return '';
  return alerts.map(a=>`<div class="card" style="margin-bottom:12px;border-left:4px solid var(--ochre)"><strong>${a.icon} ${a.title}</strong><p class="t2" style="margin:4px 0 0">${a.text}</p></div>`).join('');
}

function exportData(){
  const backup={app:'AgroKods',backupVersion:1,exportedAt:new Date().toISOString(),data:DB};
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`agrokods-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function isValidBackup(obj){
  return !!(obj && obj.app==='AgroKods' && typeof obj.backupVersion==='number' && obj.data && typeof obj.data==='object' && Array.isArray(obj.data.properties));
}
function handleImportFile(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(err){ configMsg={text:'Arquivo inválido ou corrompido. Nenhum dado foi alterado.',error:true}; e.target.value=''; renderContent(); return; }
    if(!isValidBackup(parsed)){ configMsg={text:'Este arquivo não é um backup válido do AgroKods. Nenhum dado foi alterado.',error:true}; e.target.value=''; renderContent(); return; }
    e.target.value='';
    openImportConfirm(parsed);
  };
  reader.onerror=()=>{ configMsg={text:'Não foi possível ler o arquivo selecionado.',error:true}; e.target.value=''; renderContent(); };
  reader.readAsText(file);
}
function openImportConfirm(parsed){
  const back=document.createElement('div'); back.className='modal-back';
  const quando=parsed.exportedAt? new Date(parsed.exportedAt).toLocaleString('pt-BR') : 'data desconhecida';
  back.innerHTML=`<div class="modal"><h3>Importar backup</h3>
    <p class="t2">Importar este backup substituirá os dados atuais do AgroKods neste dispositivo. Deseja continuar?</p>

      <button class="btn ghost" id="imp-cancel">Cancelar</button>
      <button class="btn" id="imp-confirm">Importar e substituir</button>
    </div></div>`;
  document.body.appendChild(back);
  back.querySelector('#imp-cancel').onclick=()=>back.remove();
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  back.querySelector('#imp-confirm').onclick=()=>{
    try{ localStorage.setItem(KEY+'_prev_backup', JSON.stringify(DB)); }catch(err){}
    const newData=parsed.data;
    migrateDB(newData);

    configMsg={text:'Backup importado com sucesso! Os dados desta tela já foram atualizados.',error:false};
    renderContent();
  };
}

const PROD_DESTINOS=['consumo próprio','venda','doação','perda','processamento'];
const PROD_PERIODOS=[{id:'tudo',label:'Tudo'},{id:'hoje',label:'Hoje'},{id:'semana',label:'Semana'},{id:'mes',label:'Mês'},{id:'ano',label:'Ano'}];
function filterPeriodo(arr){
  if(prodPeriodo==='tudo') return arr;
  const today=new Date(todayISO());
  return arr.filter(p=>{
    const d=new Date(p.data);
    if(prodPeriodo==='hoje') return p.data===todayISO();
    if(prodPeriodo==='semana'){ const diff=(today-d)/86400000; return diff>=0 && diff<7; }
    if(prodPeriodo==='mes') return d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth();
    if(prodPeriodo==='ano') return d.getFullYear()===today.getFullYear();
    return true;
  });
}

    const entries=Object.entries(byCultura).sort((a,b)=>b[1].qtd-a[1].qtd);
    const max=entries.length? Math.max(...entries.map(([,v])=>v.qtd)) : 0;
    const rows=entries.map(([n,v])=>`<div style="margin-bottom:12px">
      <div class="stat-line"><span style="flex:1;font-weight:600">${n}</span><span class="t2">${v.qtd} ${v.unidade} · ${brl(v.valor)}</span></div>
      <div class="mini-bar-track"><div class="mini-bar" style="width:${Math.max(4,v.qtd/max*100)}%"></div></div>
    </div>`).join('');
    body=`<div class="card"><h3>Produção por cultura</h3>${periodoBar}${rows||'<p class="empty">Registre sua primeira colheita para acompanhar a produção.</p>'}</div>`;
  }
  return `<h1 class="section-title">Produção</h1><p class="section-sub">Do talhão à colheita: acompanhe os ciclos de produção da propriedade.</p>${tabs}${body}`;
}

function bindContentEvents(){

  const gotoLoc=document.querySelector('[data-goto-loc]'); if(gotoLoc) gotoLoc.onclick=()=>{ view='propriedade'; propTab='propriedades'; renderNav(); renderContent(); };
  const gotoClima=document.querySelector('[data-goto-clima]'); if(gotoClima) gotoClima.onclick=()=>{ view='clima'; renderNav(); renderContent(); };
  const refreshBtn=document.querySelector('[data-refresh-clima]'); if(refreshBtn) refreshBtn.onclick=()=>refreshClima();
  const expBtn=document.querySelector('[data-export]'); if(expBtn) expBtn.onclick=exportData;
  const impBtn=document.querySelector('[data-import]'); if(impBtn) impBtn.onclick=()=>document.getElementById('import-file-input').click();
  const impInput=document.getElementById('import-file-input'); if(impInput) impInput.onchange=handleImportFile;
  const addProj=document.querySelector('[data-add-proj]'); if(addProj) addProj.onclick=()=>openProjetoForm();
  document.querySelectorAll('[data-edit-proj]').forEach(b=>b.onclick=()=>openProjetoForm(b.dataset.editProj));
  document.querySelectorAll('[data-del-proj]').forEach(b=>b.onclick=()=>{ DB.projetos=DB.projetos.filter(x=>x.id!==b.dataset.delProj); save(); renderContent(); });
  const addSist=document.querySelector('[data-add-sist]'); if(addSist) addSist.onclick=()=>openSistemaForm();
  document.querySelectorAll('[data-edit-sist]').forEach(b=>b.onclick=()=>openSistemaForm(b.dataset.editSist));
  document.querySelectorAll('[data-del-sist]').forEach(b=>b.onclick=()=>{ DB.sistemas=DB.sistemas.filter(x=>x.id!==b.dataset.delSist); save(); renderContent(); });
  const addVisita=document.querySelector('[data-add-visita]'); if(addVisita) addVisita.onclick=()=>openVisitaForm();
  document.querySelectorAll('[data-del-visita]').forEach(b=>b.onclick=()=>{ DB.visitas=DB.visitas.filter(x=>x.id!==b.dataset.delVisita); save(); renderContent(); });
  document.querySelectorAll('[data-ptab]').forEach(b=>b.onclick=()=>{ prodTab=b.dataset.ptab; renderContent(); });
  document.querySelectorAll('[data-periodo]').forEach(b=>b.onclick=()=>{ prodPeriodo=b.dataset.periodo; renderContent(); });
  const addProd=document.querySelector('[data-add-prod]'); if(addProd) addProd.onclick=()=>openProducaoForm();
  document.querySelectorAll('[data-edit-prod]').forEach(b=>b.onclick=()=>openProducaoForm(b.dataset.editProd));
  document.querySelectorAll('[data-del-prod]').forEach(b=>b.onclick=()=>{ DB.producao=DB.producao.filter(x=>x.id!==b.dataset.delProd); save(); renderContent(); });
  document.querySelectorAll('[data-ftab]').forEach(b=>b.onclick=()=>{ finTab=b.dataset.ftab; renderContent(); });
  const addFin=document.querySelector('[data-add-fin]'); if(addFin) addFin.onclick=()=>openFinanceiroForm();
  document.querySelectorAll('[data-edit-fin]').forEach(b=>b.onclick=()=>openFinanceiroForm(b.dataset.editFin));
  document.querySelectorAll('[data-del-fin]').forEach(b=>b.onclick=()=>{ DB.financeiro[finTab]=DB.financeiro[finTab].filter(x=>x.id!==b.dataset.delFin); save(); renderContent(); });
  document.querySelectorAll('[data-etab]').forEach(b=>b.onclick=()=>{ estTab=b.dataset.etab; renderContent(); });
  const addEst=document.querySelector('[data-add-est]'); if(addEst) addEst.onclick=()=>openEstoqueForm();
  document.querySelectorAll('[data-edit-est]').forEach(b=>b.onclick=()=>openEstoqueForm(b.dataset.editEst));
  document.querySelectorAll('[data-del-est]').forEach(b=>b.onclick=()=>{ DB.estoque=DB.estoque.filter(x=>x.id!==b.dataset.delEst); save(); renderContent(); });
  const addCompra=document.querySelector('[data-add-compra]'); if(addCompra) addCompra.onclick=()=>openCompraForm();
  document.querySelectorAll('[data-toggle-compra]').forEach(b=>b.onclick=()=>{ const c=DB.compras.find(x=>x.id===b.dataset.toggleCompra); c.feito=!c.feito; save(); renderContent(); });
  document.querySelectorAll('[data-del-compra]').forEach(b=>b.onclick=()=>{ DB.compras=DB.compras.filter(x=>x.id!==b.dataset.delCompra); save(); renderContent(); });
}
function openPropertyForm(id){
  const p=id? DB.properties.find(x=>x.id===id) : {name:'',area:'',purpose:''};
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal"><h3>${id?'Editar propriedade':'Nova propriedade'}</h3>
    <div class="field"><label>Nome</label><input id="pf-name" value="${p.name.replace(/"/g,'&quot;')}" placeholder="Ex: Sítio Boa Vista"></div>
    <div class="field"><label>Área (tamanho)</label><input id="pf-area" value="${p.area}" placeholder="Ex: 1.000 m²"></div>
    <div class="field"><label>Finalidade / observações</label><input id="pf-purpose" value="${p.purpose||''}" placeholder="Ex: Produção, lazer e consumo próprio"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" id="pf-cancel">Cancelar</button>
      <button class="btn" id="pf-save">Salvar</button>
    </div></div>`;
  document.body.appendChild(back);
  back.querySelector('#pf-cancel').onclick=()=>back.remove();
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  back.querySelector('#pf-save').onclick=()=>{
    const name=back.querySelector('#pf-name').value.trim(); if(!name) return;
    const areaVal=back.querySelector('#pf-area').value.trim();
    const purpose=back.querySelector('#pf-purpose').value.trim();
    if(id){ Object.assign(p,{name,area:areaVal,purpose}); }
    else DB.properties.push({id:'p'+Date.now(),name,area:areaVal,purpose,cidade:'',estado:'',pais:'',timezone:'America/Sao_Paulo',latitude:null,longitude:null});
    save(); back.remove(); renderContent();
  };
}
function openAreaForm(id){
  const a=id? DB.areas.find(x=>x.id===id) : {name:'',uso:'',propertyId:DB.properties[0]?.id};
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal"><h3>${id?'Editar área':'Nova área'}</h3>
    <div class="field"><label>Nome da área</label><input id="af-name" value="${a.name.replace(/"/g,'&quot;')}" placeholder="Ex: Fundo"></div>
    <div class="field"><label>Uso / o que tem aqui</label><input id="af-uso" value="${a.uso||''}" placeholder="Ex: Produção, amora, banana"></div>
    <div class="field"><label>Propriedade</label><select id="af-prop">${DB.properties.map(p=>`<option value="${p.id}" ${p.id===a.propertyId?'selected':''}>${p.name}</option>`).join('')}</select></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" id="af-cancel">Cancelar</button>
      <button class="btn" id="af-save">Salvar</button>
    </div></div>`;
  document.body.appendChild(back);
  back.querySelector('#af-cancel').onclick=()=>back.remove();
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  back.querySelector('#af-save').onclick=()=>{
    const name=back.querySelector('#af-name').value.trim(); if(!name) return;
    const uso=back.querySelector('#af-uso').value.trim();
    const propertyId=back.querySelector('#af-prop').value;
    if(id){ Object.assign(a,{name,uso,propertyId}); }
    else DB.areas.push({id:'a'+Date.now(),name,uso,propertyId});
    save(); back.remove(); renderContent();
  };
}
const CULT_CATS=['fruta','raiz','grão','hortaliça','árvore','ornamental','outros'];
const CULT_FINS=['consumo próprio','venda','produção','sombra','lenha','alimentação animal','ornamental','outros'];
const CULT_STATUS=['ativa','colhida','perdida','removida'];
function openCulturaForm(id){
  const c=id? DB.culturas.find(x=>x.id===id) : {nome:'',variedade:'',area:DB.areas[0]?.id,categoria:'fruta',finalidade:'consumo próprio',status:'ativa',plantio:'',obs:''};
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal"><h3>${id?'Editar cultura':'Nova cultura'}</h3>
    <div class="field"><label>Nome</label><input id="cf-nome" value="${c.nome.replace(/"/g,'&quot;')}" placeholder="Ex: Amora-preta"></div>
    <div class="row2">
      <div class="field"><label>Variedade</label><input id="cf-var" value="${c.variedade||''}"></div>
      <div class="field"><label>Área</label><select id="cf-area">${DB.areas.map(a=>`<option value="${a.id}" ${a.id===c.area?'selected':''}>${a.name}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Categoria</label><select id="cf-cat">${CULT_CATS.map(x=>`<option ${x===c.categoria?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Finalidade</label><select id="cf-fin">${CULT_FINS.map(x=>`<option ${x===c.finalidade?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Status</label><select id="cf-status">${CULT_STATUS.map(x=>`<option ${x===c.status?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Data de plantio</label><input type="date" id="cf-plantio" value="${c.plantio||''}"></div>
    </div>
    <div class="field"><label>Observações</label><input id="cf-obs" value="${c.obs||''}"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" id="cf-cancel">Cancelar</button>
      <button class="btn" id="cf-save">Salvar</button>
    </div></div>`;
  document.body.appendChild(back);
  back.querySelector('#cf-cancel').onclick=()=>back.remove();
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  back.querySelector('#cf-save').onclick=()=>{
    const nome=back.querySelector('#cf-nome').value.trim(); if(!nome) return;
    const vals={
      nome, variedade:back.querySelector('#cf-var').value.trim(),
      area:back.querySelector('#cf-area').value,
      categoria:back.querySelector('#cf-cat').value,
      finalidade:back.querySelector('#cf-fin').value,
      status:back.querySelector('#cf-status').value,
      plantio:back.querySelector('#cf-plantio').value,
      obs:back.querySelector('#cf-obs').value.trim()
    };
    if(id){ Object.assign(c,vals); }
    else DB.culturas.push(Object.assign({id:'c'+Date.now()},vals));
    save(); back.remove(); renderContent();
  };
}
document.getElementById('fab').onclick=openNewTask;
function openNewTask(){
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal">
    <h3>Nova tarefa</h3>
    <div class="field"><label>Título</label><input id="f-title" placeholder="Ex: Podar as amoreiras"></div>
    <div class="row2">
      <div class="field"><label>Área</label><select id="f-area">${DB.areas.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
      <div class="field"><label>Prioridade</label><select id="f-prio"><option value="baixa">Baixa</option><option value="normal" selected>Normal</option><option value="alta">Alta</option></select></div>
    </div>
    <div class="row2">
      <div class="field"><label>Data</label><input type="date" id="f-date" value="${todayISO()}"></div>
      <div class="field"><label>Categoria</label><select id="f-cat"><option>manutenção</option><option>plantio</option><option>poda</option><option>irrigação</option><option>limpeza</option><option>compra</option><option>outros</option></select></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:.88rem;margin-bottom:16px"><input type="checkbox" id="f-visita"> Incluir na próxima visita</label>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn ghost" id="f-cancel">Cancelar</button>
      <button class="btn" id="f-save">Salvar tarefa</button>
    </div>
  </div>`;
  document.body.appendChild(back);
  back.querySelector('#f-cancel').onclick=()=>back.remove();
  back.onclick=(e)=>{ if(e.target===back) back.remove(); };
  back.querySelector('#f-save').onclick=()=>{
    const title=back.querySelector('#f-title').value.trim();
    if(!title) return;
    DB.tasks.push({
      id:'t'+Date.now(), title,
      area:back.querySelector('#f-area').value,
      categoria:back.querySelector('#f-cat').value,
      prioridade:back.querySelector('#f-prio').value,
      status:'pendente',
      date:back.querySelector('#f-date').value,
      recorrente:false,
      visita:back.querySelector('#f-visita').checked
    });
    save(); back.remove(); view='tarefas'; renderNav(); renderContent();
  };
}
renderNav(); renderContent();
</script>
